# Site settings
title: "Karl Gorski"
name: "Karl Gorski"
description: "Personal academic website."
url: "https://klgorski.github.io"
baseurl: ""
locale: "en-US"
repository: "klgorski/klgorski.github.io"

# Theme (built natively by GitHub Pages via jekyll-remote-theme)
remote_theme: "mmistakes/minimal-mistakes@4.26.2"
minimal_mistakes_skin: "default" # "air", "contrast", "dark", "dirt", "neon", "mint", "plum", "sunrise"

# Author profile (shown in the sidebar)
author:
  name: "Karl Gorski"
  avatar: "/assets/images/avatar.png"
  bio: "Undergraduate at UC San Diego studying [your major]. Interested in [your research area]."
  location: "San Diego, CA"
  email: "kgorski@ucsd.edu"
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope-square"
      url: "mailto:kgorski@ucsd.edu"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/klgorski"

# Build settings
markdown: kramdown

# Math rendering (MathJax 3, vendored at assets/js/lib/mathjax/tex-svg.js and
# wired up in _includes/head/custom.html).
#
# kramdown's mathjax engine is what turns $$...$$ into the \( \) and \[ \]
# delimiters the head include is configured to look for. Setting it to anything
# else (or to none) stops math rendering. It is already kramdown's default --
# written out so a future edit does not silently drop it.
kramdown:
  math_engine: mathjax

# Uncomment to stop loading MathJax site-wide (per page: `mathjax: false` in
# that page's front matter).
# mathjax: false

plugins:
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-redirect-from
  - jekyll-remote-theme

# Reading files
include:
  - _pages

# Defaults
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      share: true
      related: true
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

# Outputting
permalink: /:categories/:title/
timezone: America/Los_Angeles

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .github
